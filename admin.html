<!doctype html><html lang="en"><head><script src="js/i18n.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Halls of Amenti</title><link rel="icon" href="assets/logo-gold-transparent.svg"><link rel="stylesheet" href="estilos.css"><link rel="stylesheet" href="admin.css"><script src="js/admin.js" defer></script></head><body><div class="standalone-language language" aria-label="Idioma"><button type="button" data-lang="en">EN</button><span>|</span><button type="button" data-lang="es">ES</button></div><main class="wrap admin"><a class="back" href="index.html">← Ver tienda</a><div class="intro left"><p class="eyebrow">Halls of Amenti Records</p><h1>Administración</h1><p>Pedidos, envíos y catálogo</p></div><p id="status" role="status" aria-live="polite"></p><form id="login" class="panel"><h2>Acceso privado</h2><label for="password">Contraseña de administración</label><input id="password" type="password" autocomplete="current-password" required maxlength="512"><button class="btn solid" type="submit">Entrar</button></form><section id="dashboard" hidden><div class="buttons left"><button class="btn" id="refresh" type="button">Actualizar</button><button class="btn" id="export" type="button">Descargar pedidos y catálogo</button><button class="btn" id="logout" type="button">Cerrar sesión</button></div><div id="overview" class="panel"></div><nav class="admin-tabs" aria-label="Panel"><button type="button" class="btn solid" id="tab-orders" aria-pressed="true">Pedidos</button><button type="button" class="btn" id="tab-products" aria-pressed="false">Productos y precios</button></nav><section id="orders-panel"><label for="order-search">Buscar entre los pedidos cargados</label><input id="order-search" type="search" placeholder="Número, cliente o correo"><p id="order-count" class="note"></p><div id="orders"></div><button type="button" class="btn" id="more">Carga
